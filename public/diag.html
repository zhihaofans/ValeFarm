<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="环境诊断" />
<title>环境诊断 · 微光农庄</title>
<style>
  html, body { margin:0; padding:0; background:#111; color:#eee;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; font-size:13px; }
  body { padding: env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px); }
  h1 { font-size:15px; margin:12px 0 8px; color:#f2e06a; }
  table { width:100%; border-collapse:collapse; }
  td { padding:4px 6px; border-bottom:1px solid #2a2a2a; vertical-align:top; }
  td:first-child { color:#8c8779; white-space:nowrap; width:44%; }
  td:last-child { color:#e8e4dc; font-family:ui-monospace,Menlo,monospace; word-break:break-all; }
  .ok { color:#6cbf4a !important; }
  .bad { color:#e05252 !important; }
  .bar { position:fixed; left:0; right:0; height:6px; background:#e05252; }
  .bar.top { top:0; }
  .bar.bottom { bottom:0; background:#3f7d5a; }
  button { margin:12px 0; padding:10px 18px; font-size:14px; border:0; border-radius:8px;
    background:#3f7d5a; color:#fff; font-family:inherit; }
  pre { white-space:pre-wrap; background:#1c1c1c; padding:10px; border-radius:8px;
    font-size:11px; line-height:1.5; color:#c9c4b8; }
  .warn { display:none; margin:12px 0; padding:12px 14px; border-radius:10px;
    background:#3a1717; border:1px solid #e05252; color:#ffd9d9; line-height:1.7; }
  .warn.show { display:block; }
  .warn b { color:#ff8f8f; }
  .warn ol { margin:8px 0 0; padding-left:20px; }
  .steps { color:#cfc7b6; }
</style>
</head>
<body>
  <div class="bar top" id="barTop"></div>
  <div class="bar bottom" id="barBottom"></div>
  <h1>环境诊断</h1>
  <div class="warn" id="warn"></div>
  <table id="t"></table>
  <button id="copy">复制全部</button>
  <pre id="raw"></pre>
  <script>
  (function () {
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;' +
      'padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);' +
      'padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)';
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe);
    var env = {
      top: parseFloat(cs.paddingTop) || 0,
      right: parseFloat(cs.paddingRight) || 0,
      bottom: parseFloat(cs.paddingBottom) || 0,
      left: parseFloat(cs.paddingLeft) || 0
    };
    probe.remove();

    var standalone = matchMedia('(display-mode: standalone)').matches;
    var iosStandalone = navigator.standalone === true;
    var mm = function (q) { try { return matchMedia(q).matches; } catch (e) { return 'n/a'; } };
    var vv = window.visualViewport;

    var rows = [
      ['模式', standalone || iosStandalone ? 'PWA 独立窗口' : '浏览器标签页'],
      ['display-mode:standalone', String(standalone)],
      ['navigator.standalone', String(navigator.standalone)],
      ['display-mode:fullscreen', String(mm('(display-mode: fullscreen)'))],
      ['display-mode:minimal-ui', String(mm('(display-mode: minimal-ui)'))],
      ['innerWidth × innerHeight', innerWidth + ' × ' + innerHeight],
      ['documentElement.clientH/W', document.documentElement.clientHeight + ' × ' + document.documentElement.clientWidth],
      ['visualViewport', vv ? Math.round(vv.width) + ' × ' + Math.round(vv.height) + ' (offsetTop ' + Math.round(vv.offsetTop) + ', scale ' + vv.scale + ')' : '不支持'],
      ['screen.width × height', screen.width + ' × ' + screen.height],
      ['screen.availHeight', String(screen.availHeight)],
      ['devicePixelRatio', String(devicePixelRatio)],
      ['env(top/right/bottom/left)', env.top + ' / ' + env.right + ' / ' + env.bottom + ' / ' + env.left],
      ['本页命中的兜底', (env.top > 0 || env.bottom > 0 || env.left > 0 || env.right > 0)
        ? '无（env 有效，按实测值排版）'
        : (iosStandalone && /iPad|iPhone|iPod/.test(navigator.userAgent)
          ? 'iOS 兜底 top 59 / bottom 34'
          : '无（非 iOS 独立窗口，按 0 排版）')],
      ['UA', navigator.userAgent],
    ];
    var t = document.getElementById('t');
    var raw = [];

    // 非 PWA 时给醒目引导：这份数据测不到 PWA 的数值，而 PWA 里没地址栏、
    // 打不开本页 —— 游戏里的「系统 → 环境诊断」才是唯一能到达那条路径的入口。
    if (!(standalone || iosStandalone)) {
      var wEl = document.getElementById('warn');
      wEl.className = 'warn show';
      wEl.innerHTML = '<b>当前不是 PWA 模式，这份数据测不到问题。</b>'
        + '<div class="steps">要测 PWA，请用「添加到主屏幕」的桌面图标打开游戏，'
        + '然后<b>在游戏里 ☰ → 系统 → 环境诊断</b> —— PWA 没有地址栏，输不了本页网址。</div>'
        + '<ol><li>Safari 打开游戏 → 底部「分享」→「添加到主屏幕」</li>'
        + '<li>退回桌面，从新图标进入游戏</li>'
        + '<li>游戏内 ☰ → 系统 → 环境诊断 → 右上角 ⧉ 复制</li></ol>';
    }

    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      var a = document.createElement('td'); a.textContent = r[0];
      var b = document.createElement('td');
      b.textContent = r[1];
      if (r[0] === 'env(top/right/bottom/left)') {
        b.className = (env.top > 0 || env.bottom > 0) ? 'ok' : 'bad';
      }
      tr.appendChild(a); tr.appendChild(b); t.appendChild(tr);
      raw.push(r[0] + ': ' + r[1]);
    });

    var summary = '=== 微光农庄环境诊断 ===\n'
      + (standalone || iosStandalone ? '模式: PWA 独立窗口' : '模式: 浏览器标签页') + '\n'
      + 'inner: ' + innerWidth + 'x' + innerHeight + '\n'
      + 'vv: ' + (vv ? Math.round(vv.width) + 'x' + Math.round(vv.height) + ' offTop=' + Math.round(vv.offsetTop) : 'n/a') + '\n'
      + 'screen: ' + screen.width + 'x' + screen.height + ' avail=' + screen.availHeight + '\n'
      + 'dpr: ' + devicePixelRatio + '\n'
      + 'env: t' + env.top + ' r' + env.right + ' b' + env.bottom + ' l' + env.left + '\n'
      + 'navigator.standalone: ' + navigator.standalone + '\n'
      + 'display-mode standalone: ' + standalone + '\n'
      + 'UA: ' + navigator.userAgent;

    document.getElementById('raw').textContent = summary;
    document.getElementById('copy').addEventListener('click', function () {
      var ta = document.createElement('textarea');
      ta.value = summary;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); document.getElementById('copy').textContent = '已复制 ✓'; }
      catch (e) { document.getElementById('copy').textContent = '请长按上方文本手动复制'; }
      ta.remove();
    });
  })();
  </script>
</body>
</html>
