# 发布流水线：打 v* tag（或手动）→ 校验版本 → 单测 → 构建 → 部署；e2e 并行跑、不阻塞发布。
#
# 仓库约定（见 dev-docs/GITHUB_PAGES.md）：
#   · master 保持干净：构建产物 docs/ 只用于本地调试（e2e / preview / package），不提交进仓库
#   · Pages 的发布源是「GitHub Actions」（不是分支 /docs），部署产物就是 build 出来的 docs/
#   · CI 只校验版本，不 bump；tag 必须打在 master 的最新提交上
#
# job 划分：build（单测+构建+出产物）→ e2e（仅发布/手动触发）与 deploy（仅发布/手动触发）。
# e2e 与 build 分开，是为了让推 master 的日常检查保持轻量（不跑 2 分钟的端到端）。
# 为什么 e2e 单独一个 job：
#   2026-10-23 实测 e2e 在 runner 上会偶发失败（单次通过过一次，之后又红），
#   而它跑的是"已经构建好的产物 + 本地 preview"，不影响产物本身是否可用。
#   所以把发布门禁定在「单测 + 构建」，e2e 作为并行质量信号：失败会让整个 run 标红（看得见），
#   但不会再把版本卡住。等 e2e 稳定后再把它挪回门禁（改 deploy 的 needs 即可）。
name: release

on:
  push:
    tags:
      - 'v*'
    # 推 master 只跑「单测 + 构建 + e2e」这套检查，不部署（部署见 deploy 的 if）。
    # 这样每次改动都有一条自动验证，不用靠打 tag 才发现 e2e 红了。
    branches:
      - master
  # 手动触发：验证链路/重新部署时用，不必先打 tag（跳过版本一致性校验）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出提交
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验 tag 与 public/version.json 一致（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./public/version.json').ver")"
          BUILD="$(node -p "require('./public/version.json').build")"
          echo "tag=$TAG / version.json: ver=$VER build=$BUILD"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag 与 public/version.json 的 ver 不一致（tag=$TAG, ver=$VER）。请先 stamp 再打 tag。"
            exit 1
          fi

      - name: 确认 tag 在 master 历史里（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          # tag 检出是 detached HEAD：`git fetch origin master` 只更新 FETCH_HEAD，
          # 不会创建 origin/master 引用（踩过：这里报 ambiguous argument 直接把发布干红）。
          # 所以直接问远端 master 的 sha。
          #
          # 判定用「祖先」而不是「等于顶端」：发布之后再推一条文档/CI 提交是很正常的操作，
          # 用等号会把它误判成"tag 打错提交"（v0.9.7 就这么红过一次）。
          MASTER_SHA="$(git ls-remote origin refs/heads/master | cut -f1)"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "远端 master=$MASTER_SHA"
          echo "当前 HEAD  =$HEAD_SHA"
          if [ -z "$MASTER_SHA" ]; then
            echo "::error::取不到远端 master 的 sha（网络或权限问题）"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$HEAD_SHA" "$MASTER_SHA"; then
            echo "::error::tag 打在 $(git rev-parse --short HEAD)，它不在 master 历史里。请把 tag 打在 master（或其历史提交）上。"
            exit 1
          fi

      - name: 单元测试
        run: npm test

      - name: 构建（tsc → 清空 docs/ → vite build → 注入 SW 清单）
        run: npm run build

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 另存一份可下载的产物快照（产物不再进仓库，便于回查线上到底是哪份文件）
        uses: actions/upload-artifact@v5
        with:
          name: docs-${{ github.ref_name }}
          path: docs
          if-no-files-found: warn
          retention-days: 14

  # 质量信号：端到端（发布前的门禁）
  e2e:
    needs: build
    # 推 master 只做「单测 + 构建」的快速兜底（约 1 分钟）；e2e 只在发布（tag）或手动触发时跑，
    # 避免每次发版都重复跑两遍 2 分钟的端到端。
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出提交
        uses: actions/checkout@v5

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建产物（e2e 跑的是 docs/，必须先 build）
        run: npm run build

      - name: 准备 Playwright 浏览器
        # playwright.config.ts 用 channel: 'chrome'（本机 Chrome，不是捆绑 chromium）。
        # ubuntu-latest 自带 google-chrome-stable，这一步主要装齐系统依赖并兜底。
        run: npx playwright install --with-deps chrome

      - name: 端到端（失败重试 1 次，减少偶发抖动）
        run: npx playwright test --retries=1

      - name: 上传 Playwright 报告（失败时才有）
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.ref_name }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  deploy:
    # e2e 收回发布门禁：单测/构建/e2e 任一红都不发布
    needs: [build, e2e]
    # 只有 tag（发布）或手动触发才部署；推 master 仅做检查，不动线上
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
